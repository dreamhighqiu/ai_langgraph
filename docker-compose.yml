version: '3.8'

services:
  # ========== Infrastructure Services ==========
  
  # Redis Cache (Required)
  redis:
    image: redis:7.4-alpine
    container_name: redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass redis123456 --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    networks:
      - ai_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123456", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Etcd (Milvus dependency)
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: unless-stopped
    networks:
      - ai_network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO (Milvus dependency)
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - ai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Milvus Vector Database (Required)
  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: milvus-standalone
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      - MINIO_ACCESS_KEY_ID=minioadmin
      - MINIO_SECRET_ACCESS_KEY=minioadmin123
    command: ["milvus", "run", "standalone"]
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s

  # Attu (Milvus Web UI - Optional)
  attu:
    image: zilliz/attu:v2.4
    container_name: milvus-attu
    ports:
      - "3000:3000"
    environment:
      - MILVUS_URL=milvus:19530
    depends_on:
      milvus:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai_network
    profiles:
      - full

  # PostgreSQL Database (Optional - for advanced features)
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=ai_db
      - TZ=Asia/Shanghai
      - PGDATA=/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    networks:
      - ai_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - full

  # MySQL Database (Optional - for future extensions)
  mysql:
    image: mysql:8.4.3
    container_name: mysql
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root123456
      - MYSQL_DATABASE=ai_db
      - MYSQL_USER=aiuser
      - MYSQL_PASSWORD=ai123456
      - TZ=Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=1000
      - --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    networks:
      - ai_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - full

  # ========== AI/LLM Services ==========

  # Ollama (Optional - Local LLM)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    restart: unless-stopped
    networks:
      - ai_network
    profiles:
      - ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ========== Application Services ==========

  # LightRAG Server (Required)
  lightrag:
    build:
      context: ./anything-chat-rag
      dockerfile: Dockerfile
    container_name: lightrag-server
    ports:
      - "9621:9621"
    volumes:
      - lightrag_data:/app/rag_storage
      - ./anything-chat-rag/inputs:/app/inputs
    env_file:
      - ./anything-chat-rag/.env
    environment:
      # Docker 内部网络地址覆盖 (保持不变)
      - MILVUS_URI=http://milvus:19530
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis123456
    depends_on:
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9621/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # LightRAG WebUI (RAG Frontend)
  lightrag-webui:
    build:
      context: ./anything-chat-rag/lightrag_webui
      dockerfile: Dockerfile
    container_name: lightrag-webui
    ports:
      - "5173:5173"
    env_file:
      - ./anything-chat-rag/.env
    depends_on:
      lightrag:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ========== MCP Services ==========

  # RAG Query MCP Service (Port 8002)
  rag-query-mcp:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rag-query-mcp
    ports:
      - "${RAG_QUERY_MCP_PORT:-8002}:8002"
    volumes:
      - ./testing-agents-service:/app/testing-agents-service
    env_file:
      - ./testing-agents-service/.env
    environment:
      - LIGHTRAG_BASE_URL=http://lightrag:9621
      - LIGHTRAG_API_KEY=${LIGHTRAG_API_KEY:-}
    command: python -m mcp_servers.rag_query.server --sse --port 8002 --host 0.0.0.0
    depends_on:
      lightrag:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/sse"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # RAG Anything MCP Service (Port 8001)
  rag-anything-mcp:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rag-anything-mcp
    ports:
      - "${RAG_ANYTHING_MCP_PORT:-8001}:8001"
    volumes:
      - ./testing-agents-service:/app/testing-agents-service
      - rag_anything_data:/app/rag_storage
    env_file:
      - ./testing-agents-service/.env
    environment:
      - MILVUS_URI=http://milvus:19530
      - MILVUS_DB_NAME=lightrag
      - LIGHTRAG_VECTOR_STORAGE=MilvusVectorDBStorage
      - EMBEDDING_HOST=http://ollama:11434
    command: python -m mcp_servers.rag_anything.server --sse --port 8001 --host 0.0.0.0
    depends_on:
      milvus:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/sse"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Pytest MCP Service (Port 8004)
  pytest-mcp:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pytest-mcp
    ports:
      - "${PYTEST_MCP_PORT:-8004}:8004"
    volumes:
      - ./testing-agents-service:/app/testing-agents-service
      - pytest_data:/app/generated_tests
    env_file:
      - ./testing-agents-service/.env
    command: python -m mcp_servers.pytest_mcp.server --sse --port 8004 --host 0.0.0.0
    depends_on:
      langgraph:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/sse"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # LangGraph Server (Backend API - Required)
  langgraph:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: langgraph-server
    ports:
      - "2025:2025"
    volumes:
      - ./testing-agents-service:/app/testing-agents-service
      - ./deepagents:/app/deepagents
      - langgraph_data:/app/data
    env_file:
      - ./testing-agents-service/.env
    environment:
      # Docker 内部网络地址覆盖 (保持不变)
      - LANGGRAPH_PORT=2025
      - LANGGRAPH_HOST=0.0.0.0
      - REDIS_URI=redis://:redis123456@redis:6379/0
      - LIGHTRAG_BASE_URL=http://lightrag:9621
      - MILVUS_URI=http://milvus:19530
      - MILVUS_DB_NAME=lightrag
      - LIGHTRAG_VECTOR_STORAGE=MilvusVectorDBStorage
      # Ollama 配置（如果使用 --profile ollama）
      - EMBEDDING_HOST=http://ollama:11434
      # MCP 服务地址（容器内访问，使用服务名）
      - RAG_QUERY_MCP_URL=http://rag-query-mcp:8002/sse
      - RAG_ANYTHING_MCP_URL=http://rag-anything-mcp:8001/sse
      - PYTEST_MCP_URL=http://pytest-mcp:8004/sse
    command: python testing-agents-service/start_server.py --host 0.0.0.0 --port 2025
    depends_on:
      redis:
        condition: service_healthy
      lightrag:
        condition: service_healthy
      rag-query-mcp:
        condition: service_healthy
      rag-anything-mcp:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2025/ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend UI (Required)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: frontend-ui
    ports:
      - "3200:3200"
    env_file:
      - ./testing-agents-service/.env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_LANGGRAPH_URL=http://localhost:2025
    depends_on:
      langgraph:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai_network

# ========== Volumes ==========
volumes:
  redis_data:
    driver: local
  etcd_data:
    driver: local
  minio_data:
    driver: local
  milvus_data:
    driver: local
  mysql_data:
    driver: local
  postgres_data:
    driver: local
  lightrag_data:
    driver: local
  langgraph_data:
    driver: local
  ollama_data:
    driver: local
  rag_anything_data:
    driver: local
  pytest_data:
    driver: local

# ========== Networks ==========
networks:
  ai_network:
    driver: bridge
