[project]
name = "ai-langgraph-monorepo"
version = "1.0.0"
description = "AI LangGraph Monorepo - RAG + Agent 服务栈，包含 LightRAG、MCP Server、Deep Agents Service"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "AI Testing Team" }
]
keywords = [
    "rag",
    "lightrag",
    "langgraph",
    "ai-agent",
    "deepagents",
    "k6",
    "performance-testing",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# =============================================================================
# 合并的依赖（包含 anything-chat-rag, mcp-server, testing-deep-agents-service）
# =============================================================================
dependencies = [
    # ===== LightRAG (anything-chat-rag) 核心依赖 =====
    "aiofiles>=23.0.0",
    "aiohttp",
    "configparser",
    "fastapi>=0.100.0",
    "future",
    "json_repair",
    "nano-vectordb",
    "networkx",
    "numpy>=1.24.0",
    "ollama>=0.1.0",
    "pandas>=2.0.0",
    "pipmaster",
    "pydantic>=2.0.0",
    "pyjwt>=2.8.0",
    "pypinyin",
    "python-dotenv",
    "setuptools",
    "tenacity",
    "tiktoken",
    "uvicorn>=0.20.0",
    "xlsxwriter>=3.1.0",
    "sqlalchemy>=2.0.0",
    
    # ===== LightRAG API 依赖 =====
    "ascii_colors",
    "asyncpg",
    "distro",
    "httpcore",
    "httpx>=0.25.0",
    "jiter",
    "passlib[bcrypt]",
    "psutil",
    "python-jose[cryptography]",
    "python-multipart",
    "pytz",
    "gunicorn",
    
    # ===== 文档处理依赖 =====
    "openpyxl>=3.0.0",
    "pycryptodome>=3.0.0",
    "pypdf>=4.0.0",
    "python-docx>=0.8.11",
    "python-pptx>=0.6.21",
    
    # ===== MCP Server 依赖 =====
    "fastmcp>=2.0.0",
    
    # ===== Deep Agents Service 依赖 =====
    "deepagents>=0.2.8",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-deepseek>=0.1.0",
    "langchain-mcp-adapters>=0.1.0",
    "langchain-milvus>=0.1.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.0",
    "langgraph-cli>=0.1.0",
    "langgraph-api>=0.0.1",
    "crawl4ai>=0.4.0",
    "beautifulsoup4>=4.12.0",
    
    # ===== 数据库和存储 =====
    "pymysql",
    "reportlab",
    # LightRAG 常用存储后端（根据配置自动使用）
    "neo4j>=5.0.0",
    "pymilvus>=2.4.0",
    "minio>=7.0.0",
    
    # ===== LLM Providers =====
    "openai>=2.0.0,<3.0.0",
    "anthropic>=0.18.0,<1.0.0",
]

[project.optional-dependencies]
# LightRAG 离线存储后端
storage = [
    "redis>=5.0.0",
    "neo4j>=5.0.0",
    "pymilvus>=2.4.0",
    "pymongo>=4.0.0",
    "qdrant-client>=1.9.0",
]

# 额外 LLM 提供商
llm = [
    "google-api-core>=2.0.0",
    "google-genai>=0.1.0",
    "aioboto3>=12.0.0",
    "voyageai>=0.2.0",
]

# 文档处理（重依赖）
docling = [
    "docling>=2.0.0",
    "raganything>=1.0.0",
]

# 图表生成
charts = [
    "matplotlib>=3.7.0",
]

# 评估框架
evaluation = [
    "ragas>=0.2.0",
    "datasets>=2.0.0",
]

# 可观测性
observability = [
    "langfuse>=2.0.0",
]

# 全部安装
all = [
    "ai-langgraph-monorepo[storage,llm,docling,charts,evaluation,observability]",
]

[project.scripts]
# LightRAG 命令
lightrag-server = "lightrag.api.lightrag_server:main"
lightrag-gunicorn = "lightrag.api.run_with_gunicorn:main"
lightrag-download-cache = "lightrag.tools.download_cache:main"
lightrag-clean-llmqc = "lightrag.tools.clean_llm_query_cache:main"
platform-api-server = "platform_api.main:run"
platform-import-agents = "platform_api.cli.import_graph:main"

[project.urls]
Homepage = "https://github.com/your-org/ai-langgraph"
Documentation = "https://github.com/your-org/ai-langgraph#readme"
Repository = "https://github.com/your-org/ai-langgraph"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# 包含平台 API 包，其它子项目继续以可编辑方式引用
packages = ["platform_api"]
py-modules = []

[tool.uv.sources]
# 本地包路径映射
lightrag-hku = { path = "anything-chat-rag", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pre-commit",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests", "anything-chat-rag/tests", "testing-deep-agents-service/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
