[project]
name = "ai-langgraph-monorepo"
version = "1.0.0"
description = "AI LangGraph Monorepo - RAG + Agent 服务栈，包含 LightRAG、MCP Server、Deep Agents Service"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "AI Testing Team" }
]
keywords = [
    "rag",
    "lightrag",
    "langgraph",
    "ai-agent",
    "deepagents",
    "k6",
    "performance-testing",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# =============================================================================
# 合并的依赖（包含 anything-chat-rag, mcp-server, testing-agents-service）
# =============================================================================
dependencies = [
    # ===== LangChain & LangGraph 生态 =====
    "langgraph>=1.0.5",
    "langchain>=1.2.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-deepseek>=1.0.1",
    "langchain-mcp-adapters>=0.2.1",
    "langchain-milvus>=0.3.0",
    "langchain-ollama>=1.0.0",
    "langgraph-cli>=0.4.11",
    "langgraph-api>=0.5.0,<1.0.0",
    
    # ===== DeepAgents & MCP =====
    "deepagents>=0.3.0",
    "fastmcp>=2.14.1",
    
    # ===== Web 框架 =====
    "fastapi>=0.125.0",
    "uvicorn[standard]>=0.38.0",
    "gunicorn",
    "python-multipart",
    
    # ===== LLM 提供商 =====
    "openai>=2.0.0,<3.0.0",
    "anthropic>=0.18.0,<1.0.0",
    "ollama>=0.6.0",
    
    # ===== 文档处理 =====
    "openpyxl>=3.0.0,<4.0.0",
    "pycryptodome>=3.0.0,<4.0.0",
    "pypdf>=6.1.0",
    "python-docx>=0.8.11,<2.0.0",
    "python-pptx>=0.6.21,<2.0.0",
    # docling: 高级文档解析工具（独立包，不依赖 mineru）
    "docling>=2.63.0,<3.0.0",
    # 注意：raganything 是项目内的本地包（anything-chat-rag/raganything/）
    # 已配置使用 docling 作为解析器，不依赖 mineru
    # mineru 未安装（避免与 openai>=2 和 aiofiles>=25 的依赖冲突）
    
    # ===== 数据处理 =====
    "pandas>=2.0.0,<2.4.0",
    "numpy>=1.24.0,<2.0.0",
    "xlsxwriter>=3.1.0",
    
    # ===== 存储后端 =====
    "pymilvus>=2.6.2,<3.0.0",
    "neo4j>=5.0.0,<7.0.0",
    "qdrant-client>=1.11.0,<2.0.0",
    "pymysql",
    "asyncpg>=0.29.0,<1.0.0",
    "sqlalchemy>=2.0.0",
    "pymongo>=4.0.0,<5.0.0",
    "minio>=7.0.0",
    "redis>=5.0.0,<8.0.0",
    
    # ===== 网络与HTTP =====
    "aiohttp",
    "aiofiles>=25.1.0",
    "httpx>=0.28.1",
    "httpcore",
    "crawl4ai>=0.7.8",
    "beautifulsoup4>=4.12.0",
    
    # ===== 工具库 =====
    "python-dotenv",
    "configparser",
    "json_repair",
    "jiter",
    "pyjwt>=2.8.0,<3.0.0",
    "passlib[bcrypt]",
    "python-jose[cryptography]",
    "google-api-core>=2.0.0,<3.0.0",
    "google-genai>=1.0.0,<2.0.0",
    "tenacity",
    "tiktoken",
    "pypinyin",
    "nano-vectordb",
    "networkx",
    "pipmaster",
    "pytz",
    "psutil",
    "distro",
    "ascii_colors",
    "future",
    "setuptools",
    
    # ===== 报表生成 =====
    "reportlab",
    
    # ===== 类型检查 =====
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# LightRAG 离线存储后端
storage = [
    "redis>=5.0.0,<8.0.0",
    "neo4j>=5.0.0,<7.0.0",
    "pymilvus>=2.6.2,<3.0.0",
    "pymongo>=4.0.0,<5.0.0",
    "qdrant-client>=1.11.0,<2.0.0",
]

# 额外 LLM 提供商（注意：zhipuai 与 fastmcp 有版本冲突，暂时注释）
llm = [
    # "zhipuai>=2.0.0,<3.0.0",  # 与 fastmcp 的 pyjwt 版本要求冲突
    "aioboto3>=12.0.0,<16.0.0",
    "voyageai>=0.2.0,<1.0.0",
    # "llama-index>=0.9.0,<1.0.0",
]

# 图表生成
charts = [
    "matplotlib>=3.7.0",
]

# 评估框架
evaluation = [
    "ragas>=0.3.7",
    "datasets>=4.3.0",
]

# 可观测性
observability = [
    "langfuse>=3.8.1",
]

# 开发工具
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=4.0.0",
    "allure-pytest>=2.15.2",
    "pre-commit",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

# 全部安装
all = [
    "ai-langgraph-monorepo[storage,llm,charts,evaluation,observability,dev]",
]

[project.scripts]
# LightRAG 命令
lightrag-server = "lightrag.api.lightrag_server:main"
lightrag-gunicorn = "lightrag.api.run_with_gunicorn:main"
lightrag-download-cache = "lightrag.tools.download_cache:main"
lightrag-clean-llmqc = "lightrag.tools.clean_llm_query_cache:main"

[project.urls]
Homepage = "https://github.com/your-org/ai-langgraph"
Documentation = "https://github.com/your-org/ai-langgraph#readme"
Repository = "https://github.com/your-org/ai-langgraph"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# 包含所有子项目
packages = []
py-modules = []

[dependency-groups]
# 开发依赖组（替代已废弃的 tool.uv.dev-dependencies）
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=4.0.0",
    "allure-pytest>=2.15.2",
    "pre-commit",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.uv.sources]
# 本地包路径映射（可编辑模式）
lightrag-hku = { path = "anything-chat-rag", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests", "anything-chat-rag/tests", "testing-agents-service/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
