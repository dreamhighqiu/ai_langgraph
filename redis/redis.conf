# Redis 配置文件

# 网络配置
bind 0.0.0.0
protected-mode no
port 6379

# 持久化配置
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 内存配置
maxmemory 512mb
maxmemory-policy allkeys-lru

# 日志配置
loglevel notice
logfile ""

# 密码配置（通过命令行参数设置）
# requirepass redis123456

# 性能优化
tcp-backlog 511
timeout 0
tcp-keepalive 300

# RDB 快照配置
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128

# 数据库数量
databases 16

# 客户端连接
maxclients 10000

