[pytest]
# Pytest 配置文件

# 测试文件匹配模式
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 测试目录
testpaths = tests

# Python 路径 - 添加项目根目录到 Python 路径
pythonpath = .

# 命令行选项
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 标记 (markers)
markers =
    slow: 标记慢测试（可以用 -m "not slow" 跳过）
    integration: 标记集成测试
    unit: 标记单元测试
    asyncio: 标记异步测试

# 异步测试超时
asyncio_mode = auto

# 覆盖率配置（可选）
# 需要安装: pip install pytest-cov
# 使用: pytest --cov=agents --cov-report=html

