[tool:pytest]
# 测试文件匹配模式
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试执行配置
addopts = 
    -v
    --tb=short
    --strict-markers
    --alluredir=./allure-results
    --junitxml=./test-results/junit.xml
    --html=./test-results/report.html
    --self-contained-html

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 标记配置
markers =
    smoke: 冒烟测试 - 核心功能测试
    regression: 回归测试 - 全面功能测试
    integration: 集成测试 - 多模块集成测试
    slow: 慢速测试 - 需要较长时间执行的测试
    auth: 认证相关测试
    game: 游戏数据相关测试
    social: 社交功能相关测试
    payment: 支付相关测试
    system: 系统状态相关测试

# 测试发现配置
norecursedirs = 
    .git
    .idea
    __pycache__
    *.egg-info
    build
    dist
    venv
    node_modules

# 测试超时配置（单位：秒）
timeout = 300
timeout_method = thread

# 测试失败重试配置
reruns = 1
reruns_delay = 2

# 测试报告配置
junit_suite_name = PlayTurbo API Tests
junit_logging = all

# 测试过滤配置
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# 并行测试配置
# numprocesses = auto
# maxprocesses = 4

# 覆盖率配置（如果安装了pytest-cov）
# --cov=.
# --cov-report=html
# --cov-report=xml
# --cov-report=term-missing