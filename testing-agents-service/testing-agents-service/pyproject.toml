[project]
name = "k6-agent"
version = "2.0.0"
description = "Enterprise-grade AI-powered K6 Performance Testing Agent built on DeepAgents framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Performance Testing Team" }
]
keywords = [
    "k6",
    "performance-testing",
    "load-testing",
    "ai-agent",
    "deepagents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "deepagents>=0.2.8",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "langchain-core>=0.1.0",
    "langgraph-cli[inmem]>=0.4.7",
    "langchain-deepseek>=1.0.1",
    "langchain-mcp-adapters>=0.1.14",
    "crawl4ai>=0.7.6",
    "fastmcp>=2.14.0",
]

[project.optional-dependencies]
charts = [
    "matplotlib>=3.7.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
all = [
    "k6-agent[charts,dev]",
]

[project.urls]
Homepage = "https://github.com/your-org/k6-agent"
Documentation = "https://github.com/your-org/k6-agent#readme"
Repository = "https://github.com/your-org/k6-agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k6_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
# Lock file version: Mi8zOmFIVnBZMlhwZ3JIa3VwSHBuSjQ2WjJSNVFRPT06NDI2ZjQwOGU=
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

# Cache key: MS8zOmFIVnBZMlhwZ3JIa3VwSHBuSjQ2WjJSNVFRPT06NDI2ZjQwOGU=
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
